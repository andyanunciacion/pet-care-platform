packages:
  - apps/*
  - packages/*

# One version of each shared tool for the whole monorepo.
# Packages reference these with "catalog:" instead of a version range.
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^24.19.0
  '@types/pg': ^8.23.1
  # Stable line; 1.0 is still a release candidate (ARCHITECTURE D17).
  drizzle-orm: ^0.45.3
  eslint: ^10.11.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.12.0
  pg: ^8.23.0
  prettier: ^3.9.9
  turbo: ^2.11.5
  # Stay on 6.0.x: typescript-eslint doesn't support TypeScript 6.1+ / 7 yet.
  typescript: ~6.0.3
  typescript-eslint: ^8.70.0
  vitest: ^5.0.2
  zod: ^4.6.5

# Which dependencies may run install scripts (pnpm blocks them by default, since
# they run arbitrary code at install time). Only allow one when it's really needed.
allowBuilds:
  # Denied: each ships its native binary as a platform-specific optional dependency
  # (e.g. @swc/core-win32-x64-msvc); the script only re-checks it or builds from source.
  '@parcel/watcher': false # via next-intl
  '@swc/core': false # via next-intl
  esbuild: false # via drizzle-kit
  unrs-resolver: false # via eslint-config-next

peerDependencyRules:
  allowedVersions:
    # Declares TypeScript 5 only, but works on 6 (verified by the api-client drift test).
    openapi-typescript>typescript: '6'

# Refuse to install on a Node version outside "engines" (see .nvmrc).
engineStrict: true
